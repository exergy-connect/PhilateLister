# Scrape/consolidate the StampWorld China catalogue, compile the FindChineseSets
# viewer, and publish index.html to public/setfinder/ for GitHub Pages.
name: Find Chinese Sets

on:
  push:
    branches:
      - main
    paths:
      - "examples/stamp_collector/**"
      - "examples/FindChineseSets/**"
      - ".github/workflows/find-chinese-sets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: find-chinese-sets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install ImageMagick (thumbnails)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick

      - name: Collect StampWorld catalogue JSON
        uses: exergy-connect/xFrame.ai/actions/xform@main
        with:
          working-directory: examples/stamp_collector
          sources: stamp_collector.xp
          materialization: json
          auto-approve: "true"

      - name: Consolidate period JSON into china_collection.xp
        uses: exergy-connect/xFrame.ai/actions/xform@main
        with:
          working-directory: examples/stamp_collector
          sources: consolidate.xp
          materialization: xp
          auto-approve: "true"

      - name: Compile FindChineseSets viewer
        uses: exergy-connect/xFrame.ai/actions/xform@main
        with:
          working-directory: examples/FindChineseSets
          sources: filters.js index.xp
          materialization: html

      - name: Publish to public/setfinder
        run: |
          set -euo pipefail
          src="examples/FindChineseSets/output/index.html"
          if [[ ! -f "$src" ]]; then
            echo "::error file=${src}::FindChineseSets HTML was not produced"
            exit 1
          fi
          mkdir -p public/setfinder
          cp "$src" public/setfinder/index.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/setfinder/index.html
          if git diff --staged --quiet; then
            echo "No changes to public/setfinder/index.html."
            exit 0
          fi
          git commit -m "public: refresh setfinder viewer (CI)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
