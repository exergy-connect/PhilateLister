<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GHSS Auction bidder registration — 19–20 September 2026</title>
  <style>
    @page {
      size: letter;
      margin: 0;
    }

    :root {
      --navy: #002d62;
      --sky: #d1dce5;
      --maroon: #8b1a1a;
      --white: #ffffff;
      --panel: #e8eef3;
      --ink: #002d62;
      --muted: #3d5a7a;
      --line: color-mix(in srgb, var(--navy) 18%, var(--sky));
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      color: var(--ink);
      background: #c5cfd8;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35in;
      padding: 0.35in 0;
    }

    .page {
      display: flex;
      flex-direction: column;
      width: 8.5in;
      height: 11in;
      padding: 0.2in;
      background: var(--navy);
      page-break-after: always;
      break-after: page;
    }

    .page:last-child {
      page-break-after: auto;
      break-after: auto;
    }

    .sheet {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--white);
      overflow: hidden;
    }

    header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.16in;
      align-items: center;
      padding: 0.14in 0.2in 0.12in;
      background: var(--navy);
      color: var(--white);
    }

    .mark {
      width: 0.48in;
      height: 0.48in;
      flex-shrink: 0;
    }

    .mark svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .brand { min-width: 0; }

    .kicker {
      margin: 0 0 0.02in;
      font-size: 8pt;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--sky);
    }

    h1 {
      margin: 0;
      font-size: 16pt;
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1.05;
    }

    .dates {
      margin: 0.04in 0 0;
      font-size: 10pt;
      font-weight: 600;
      color: var(--white);
    }

    .sheet-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      padding: 0.06in 0.12in;
      border: 1.5pt solid color-mix(in srgb, var(--sky) 70%, var(--white));
      background: color-mix(in srgb, var(--navy) 82%, var(--white));
      text-align: right;
    }

    .sheet-badge .label {
      font-size: 7pt;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--sky);
    }

    .sheet-badge .range {
      margin-top: 0.02in;
      font-size: 13pt;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--white);
    }

    .notice {
      display: flex;
      align-items: baseline;
      gap: 0.16in;
      padding: 0.08in 0.2in;
      background: var(--panel);
      border-bottom: 3px solid var(--maroon);
    }

    .notice h2 {
      margin: 0;
      flex-shrink: 0;
      font-size: 7.5pt;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--maroon);
    }

    .notice p {
      margin: 0;
      font-size: 8.4pt;
      line-height: 1.28;
      color: var(--ink);
    }

    .notice strong { color: var(--maroon); }

    table {
      flex: 1;
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead th {
      padding: 0.05in 0.08in;
      background: var(--navy);
      color: var(--white);
      font-size: 7.5pt;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: left;
      vertical-align: middle;
    }

    thead th.num,
    tbody td.num {
      width: 0.58in;
      text-align: center;
      padding-left: 0;
      padding-right: 0;
    }

    thead th.phone,
    tbody td.phone { width: 1.7in; }

    thead th.sign,
    tbody td.sign { width: 2.15in; }

    tbody tr { height: 4%; }

    tbody td {
      height: 0.32in;
      padding: 0 0.1in;
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      font-size: 11pt;
      vertical-align: middle;
    }

    tbody td.phone { border-right: none; }

    tbody tr:nth-child(even) td { background: var(--panel); }

    tbody td.num {
      font-size: 12pt;
      font-weight: 700;
      color: var(--navy);
      background: color-mix(in srgb, var(--sky) 55%, var(--white));
      border-right: 1.5pt solid var(--navy);
      border-bottom-color: color-mix(in srgb, var(--navy) 28%, var(--sky));
    }

    tbody tr:nth-child(even) td.num {
      background: color-mix(in srgb, var(--sky) 78%, var(--white));
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.06in 0.2in 0.08in;
      border-top: 2pt solid var(--navy);
      font-size: 7.5pt;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @media print {
      html, body {
        background: var(--white);
        width: 8.5in;
      }

      body {
        display: block;
        padding: 0;
        gap: 0;
      }

      .page {
        margin: 0;
      }
    }

    @media screen {
      .page {
        box-shadow: 0 10px 28px rgb(0 45 98 / 22%);
      }
    }
  </style>
</head>
<body>
  <script>
    const mark = `
      <div class="mark" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
          <rect width="64" height="64" fill="#002d62"/>
          <rect x="10" y="10" width="44" height="44" fill="#ffffff"/>
          <g fill="#002d62">
            <circle cx="17.333" cy="10" r="2.5"/>
            <circle cx="24.667" cy="10" r="2.5"/>
            <circle cx="32" cy="10" r="2.5"/>
            <circle cx="39.333" cy="10" r="2.5"/>
            <circle cx="46.667" cy="10" r="2.5"/>
            <circle cx="17.333" cy="54" r="2.5"/>
            <circle cx="24.667" cy="54" r="2.5"/>
            <circle cx="32" cy="54" r="2.5"/>
            <circle cx="39.333" cy="54" r="2.5"/>
            <circle cx="46.667" cy="54" r="2.5"/>
            <circle cx="10" cy="17.333" r="2.5"/>
            <circle cx="10" cy="24.667" r="2.5"/>
            <circle cx="10" cy="32" r="2.5"/>
            <circle cx="10" cy="39.333" r="2.5"/>
            <circle cx="10" cy="46.667" r="2.5"/>
            <circle cx="54" cy="17.333" r="2.5"/>
            <circle cx="54" cy="24.667" r="2.5"/>
            <circle cx="54" cy="32" r="2.5"/>
            <circle cx="54" cy="39.333" r="2.5"/>
            <circle cx="54" cy="46.667" r="2.5"/>
          </g>
          <path fill="none" stroke="#002d62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"
                d="M 43.500,32.000 L 43.426,32.747 L 43.211,33.463 L 42.865,34.120 L 42.411,34.695 L 41.870,35.173 L 41.267,35.546 L 40.627,35.815 L 39.967,35.984 L 39.307,36.059 L 38.657,36.052 L 38.026,35.973 L 37.421,35.833 L 36.844,35.642 L 36.296,35.409 L 35.778,35.141 L 35.286,34.846 L 34.819,34.528 L 34.374,34.194 L 33.949,33.846 L 33.540,33.487 L 33.144,33.122 L 32.757,32.750 L 32.377,32.376 L 32.000,32.000 L 31.623,31.624 L 31.243,31.250 L 30.856,30.878 L 30.460,30.513 L 30.051,30.154 L 29.626,29.806 L 29.181,29.472 L 28.714,29.154 L 28.222,28.859 L 27.704,28.591 L 27.156,28.358 L 26.579,28.167 L 25.974,28.027 L 25.343,27.948 L 24.693,27.941 L 24.033,28.016 L 23.373,28.185 L 22.733,28.454 L 22.130,28.827 L 21.589,29.305 L 21.135,29.880 L 20.789,30.537 L 20.574,31.253 L 20.500,32.000 L 20.574,32.747 L 20.789,33.463 L 21.135,34.120 L 21.589,34.695 L 22.130,35.173 L 22.733,35.546 L 23.373,35.815 L 24.033,35.984 L 24.693,36.059 L 25.343,36.052 L 25.974,35.973 L 26.579,35.833 L 27.156,35.642 L 27.704,35.409 L 28.222,35.141 L 28.714,34.846 L 29.181,34.528 L 29.626,34.194 L 30.051,33.846 L 30.460,33.487 L 30.856,33.122 L 31.243,32.750 L 31.623,32.376 L 32.000,32.000 L 32.377,31.624 L 32.757,31.250 L 33.144,30.878 L 33.540,30.513 L 33.949,30.154 L 34.374,29.806 L 34.819,29.472 L 35.286,29.154 L 35.778,28.859 L 36.296,28.591 L 36.844,28.358 L 37.421,28.167 L 38.026,28.027 L 38.657,27.948 L 39.307,27.941 L 39.967,28.016 L 40.627,28.185 L 41.267,28.454 L 41.870,28.827 L 42.411,29.305 L 42.865,29.880 L 43.211,30.537 L 43.426,31.253 L 43.500,32.000"/>
        </svg>
      </div>`;

    const perSheet = 25;
    const sheets = 8;

    for (let sheet = 0; sheet < sheets; sheet++) {
      const start = sheet * perSheet + 1;
      const end = start + perSheet - 1;
      const rows = Array.from({ length: perSheet }, (_, i) => {
        const n = String(start + i).padStart(3, "0");
        return `<tr><td class="num">${n}</td><td></td><td class="sign"></td><td class="phone"></td></tr>`;
      }).join("");

      document.body.insertAdjacentHTML("beforeend", `
        <div class="page">
          <div class="sheet">
            <header>
              ${mark}
              <div class="brand">
                <p class="kicker">Greater Houston Stamp Show</p>
                <h1>GHSS Auction bidder registration</h1>
                <p class="dates">Saturday 19 and Sunday 20 September 2026</p>
              </div>
              <div class="sheet-badge">
                <span class="label">Sheet ${sheet + 1} of ${sheets}</span>
                <span class="range">${start}–${end}</span>
              </div>
            </header>
            <div class="notice">
              <h2>Acknowledgment</h2>
              <p>Print your name and sign to receive the bidder number at left. <strong>Signature confirms you have read and will follow the auction rules.</strong> Phone is optional, for winner notification.</p>
            </div>
            <table>
              <thead>
                <tr>
                  <th class="num">No.</th>
                  <th>Printed name</th>
                  <th class="sign">Signature</th>
                  <th class="phone">Phone (optional)</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
            <footer>
              <span>Greater Houston Stamp Show</span>
              <span>Use this bidder number on all bid sheets</span>
              <span>Sheet ${sheet + 1} of ${sheets} · Nos. ${start}–${end}</span>
            </footer>
          </div>
        </div>
      `);
    }
  </script>
</body>
</html>
