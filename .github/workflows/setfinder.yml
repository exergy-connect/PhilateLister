# Scrape/consolidate StampWorld catalogues, build SetFinder JSON catalogs,
# compile the viewer, and publish to public/setfinder/ for GitHub Pages.
name: Set Finder

on:
  push:
    branches:
      - main
    paths:
      - "examples/stamp_collector/**"
      - "examples/SetFinder/**"
      - ".github/workflows/setfinder.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: setfinder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install ImageMagick (thumbnails)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick

      # collect.sh / consolidate.sh need `xform` on PATH (--with args the action
      # does not expose). The compile step below uses the action; it does not
      # need this install — the action already bundles skills/xform-run.
      - name: Install xform CLI
        run: |
          set -euo pipefail
          mkdir -p /tmp/xform-run/scripts
          curl -fsSL \
            https://raw.githubusercontent.com/exergy-connect/xFrame.ai/main/skills/xform-run/scripts/xform.min.js \
            -o /tmp/xform-run/scripts/xform.min.js
          printf '%s\n' '#!/usr/bin/env bash' 'exec node /tmp/xform-run/scripts/xform.min.js "$@"' | sudo tee /usr/local/bin/xform >/dev/null
          sudo chmod +x /usr/local/bin/xform
          xform -h | head -3

      # - name: Collect StampWorld catalogue JSON
      #   working-directory: examples/stamp_collector
      #   run: ./collect.sh china

      # - name: Consolidate period JSON into country collection.xp
      #   working-directory: examples/stamp_collector
      #   run: ./consolidate.sh china

      # - name: Export country catalog JSON
      #   run: |
      #     set -euo pipefail
      #     node examples/SetFinder/scripts/build-catalogs.mjs
      #     test -f examples/SetFinder/catalogs/countries.json
      #     test -f examples/SetFinder/catalogs/cn.json

      - name: Compile SetFinder viewer
        uses: exergy-connect/xFrame.ai/actions/xform@main
        with:
          working-directory: examples/SetFinder
          sources: filters.js index.xp
          materialization: html

      - name: Publish to public/setfinder and shared catalogs
        run: |
          set -euo pipefail
          src_html="examples/SetFinder/output/index.html"
          if [[ ! -f "$src_html" ]]; then
            echo "::error file=${src_html}::SetFinder HTML was not produced"
            exit 1
          fi
          mkdir -p public/setfinder/images public/catalogs
          cp "$src_html" public/setfinder/index.html
          # Single shared catalogue tree for SetFinder + AlbumView (not per-app copies).
          cp examples/SetFinder/catalogs/*.json public/catalogs/
          cp -R examples/SetFinder/images/. public/setfinder/images/
          if [[ -f examples/SetFinder/favicon.ico ]]; then
            cp examples/SetFinder/favicon.ico public/setfinder/favicon.ico
          fi
          # Drop legacy per-app catalogue copies if present.
          rm -rf public/setfinder/catalogs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/setfinder public/catalogs
          if git diff --staged --quiet; then
            echo "No changes to public/setfinder/ or public/catalogs/."
            exit 0
          fi
          git commit -m "public: refresh setfinder viewer and shared catalogs (CI)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
