  const num = (el, name) => Number(el.getAttribute(name) || "");

  const cropRecordForDetail = (detailId) => {
    if (!detailId) return null;
    const el = document.querySelector(`.xframe-crop[data-xframe-crop-detail="${CSS.escape(detailId)}"]`);
    return el instanceof HTMLElement ? el : null;
  };

  const seedFromEl = (el) => {
    if (!(el instanceof HTMLElement)) return null;
    const srcW = num(el, "data-xframe-src-w");
    const srcH = num(el, "data-xframe-src-h");
    const cropX = num(el, "data-xframe-crop-x");
    const cropY = num(el, "data-xframe-crop-y");
    const cropW = num(el, "data-xframe-crop-w");
    const cropH = num(el, "data-xframe-crop-h");
    const dpi = num(el, "data-xframe-dpi");
    if (!(srcW > 0 && srcH > 0 && cropW > 0 && cropH > 0)) return null;
    return {
      sourceId: el.getAttribute("data-xframe-crop-source")?.trim() || "",
      detailId: el.getAttribute("data-xframe-crop-detail")?.trim() || "",
      srcW,
      srcH,
      cropX,
      cropY,
      cropW,
      cropH,
      dpi,
    };
  };

  const clamp = (state) => {
    const srcW = state.srcW;
    const srcH = state.srcH;
    const ratio = state.cropW > 0 && state.cropH > 0 ? state.cropW / state.cropH : 1;
    let cropW = Math.max(1, state.cropW);
    let cropH = Math.max(1, state.cropH);
    if (cropW > srcW) {
      cropW = srcW;
      cropH = Math.max(1, cropW / ratio);
    }
    if (cropH > srcH) {
      cropH = srcH;
      cropW = Math.max(1, cropH * ratio);
    }
    if (cropW > srcW) {
      cropW = srcW;
      cropH = Math.max(1, cropW / ratio);
    }
    return {
      sourceId: state.sourceId || "",
      detailId: state.detailId || "",
      srcW,
      srcH,
      cropX: Math.min(Math.max(0, state.cropX), Math.max(0, srcW - cropW)),
      cropY: Math.min(Math.max(0, state.cropY), Math.max(0, srcH - cropH)),

      cropH,
      dpi: state.dpi,
    };

    if (!el.classList.contains("xframe-crop-callout")) return;
    el.style.left = `${(state.cropX / state.srcW) * 100}%`;
    el.style.top = `${(state.cropY / state.srcH) * 100}%`;
    el.style.width = `${(state.cropW / state.srcW) * 100}%`;

    ruler.style.setProperty("--xframe-src-h", String(state.srcH));
    ruler.style.setProperty("--xframe-crop-x", String(state.cropX));
    ruler.style.setProperty("--xframe-crop-y", String(state.cropY));
    ruler.style.setProperty("--xframe-crop-w", String(state.cropW));
    ruler.style.setProperty("--xframe-crop-h", String(state.cropH));

    if (!state?.detailId) return;

    if (!detailId) return null;

    const next = clamp(seeded);

  const get = (detailId) => ensure(detailId);

  const set = (detailId, patch) => {
    if (!detailId) return null;
    const prev = ensure(detailId) || {};
    const next = clamp({
      sourceId: patch.sourceId || prev.sourceId || "",
      detailId,
      srcW: patch.srcW ?? prev.srcW,
      srcH: patch.srcH ?? prev.srcH,
      cropX: patch.cropX ?? prev.cropX,
      cropY: patch.cropY ?? prev.cropY,
      cropW: patch.cropW ?? prev.cropW,
      cropH: patch.cropH ?? prev.cropH,
      dpi: patch.dpi ?? prev.dpi,
    });

    byDetail.set(detailId, next);

    if (!(ruler instanceof HTMLElement)) return null;
    const img = ruler.querySelector(".xframe-mm-ruler-view > img");
    const detailId = ruler.getAttribute("data-xframe-crop-detail")?.trim()

    const srcW = css("--xframe-src-w");
    const srcH = css("--xframe-src-h");
    const cropX = css("--xframe-crop-x");
    const cropY = css("--xframe-crop-y");
    const cropW = css("--xframe-crop-w");
    const cropH = css("--xframe-crop-h");
    if (!(srcW > 0 && srcH > 0 && cropW > 0 && cropH > 0)) return null;

  };

    if (!detailId) return;
    const run = () => {
      const fallback = document.getElementById(detailId);
      for (const ruler of rulersForDetail(detailId)) bakeRuler(ruler, fallback);
    };
    const pending = sourceImageForState(get(detailId), document.getElementById(detailId));
    if (pending && !(pending.complete && pending.naturalWidth > 0)) {
      pending.addEventListener("load", run, { once: true });

    const detailId = el.getAttribute("data-xframe-crop-detail")?.trim();

      // the crop over proportionally instead of reusing the old pixel box.
      const scaleX = width / prev.srcW;

      const nextDpi = trustedDpi ?? 0;

        cropX: prev.cropX * scaleX,
        cropY: prev.cropY * scaleY,
        cropW: prev.cropW * scaleX,

      const id = el.getAttribute("data-xframe-crop-detail")?.trim();

    document.querySelectorAll(".xframe-crop[data-xframe-crop-detail]").forEach((el) => {
      const id = el.getAttribute("data-xframe-crop-detail")?.trim();
      if (id) bakeDetail(id);
    });
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }

  document.addEventListener("contextmenu", (event) => {
    const img = event.target instanceof Element
      ? event.target.closest(".xframe-mm-ruler[data-xframe-crop] .xframe-mm-ruler-view > img")
      : null;
    if (!(img instanceof HTMLImageElement)) return;
    const ruler = img.closest(".xframe-mm-ruler");
    if (ruler instanceof HTMLElement) bakeRuler(ruler, img);
  }, true);

  return { get, set, rescaleSource, cropsForSource, bakeRuler, bakeDetail, livePreview };
});

    const trimmed = String(key || "").trim();

    const property = trimmed.slice(dot + 1).trim();
    if (!id || !property) return null;
    return { id, property };

  const htmlSrcTags = new Set(["IMG", "IFRAME", "SOURCE", "VIDEO", "AUDIO"]);

    const prop = String(property || "").trim();
    const tag = el instanceof Element ? el.tagName : "";
    if (prop === "url" && htmlSrcTags.has(tag)) return "src";
    return prop;
  };

  const bucket = (id) => {
    let map = values.get(id);
    if (!map) {
      map = new Map();
      values.set(id, map);
    }
    return map;
  };

  const assignDom = (el, name, value) => {
    if (name.startsWith("--")) {
      if (el instanceof HTMLElement) el.style.setProperty(name, value);
      return;
    }
    el.setAttribute(name, value);
    if (!(name in el)) return;
    try {
      el[name] = value;
    } catch {
      /* read-only IDL */
    }
  };

      if (el instanceof HTMLElement) el.style.removeProperty(name);
      return;

    el.removeAttribute(name);

            document.querySelectorAll(`img[data-xframe-media-ref="${CSS.escape(el.id)}"]`).forEach((img) => {
              if (!(img instanceof HTMLImageElement)) return;
              clearDom(img, "src");
            });
          }
        }
      }
    } else {
      bucket(elId).set(prop, raw);
      applyToElement(elId, prop, raw, options.source || "set");
    }

<script>
window.__XFRAME__.runtime.register("crop_drag", { import: ["url_params.get", "url_params.set", "url_params.read", "crop.get", "crop.set", "crop.bakeDetail", "crop.livePreview"] }, (runtime) => {
  /** @type {{
   *   surface: HTMLElement,
   *   frame: HTMLElement,
   *   pointerId: number,
   *   startClientX: number,
   *   startClientY: number,
   *   originX0: number,
   *   originY0: number,
   *   x0: number,
   *   y0: number,
   *   cropW: number,
   *   cropH: number,
   *   srcW: number,
   *   srcH: number,
   *   scaleX: number,
   *   scaleY: number,
   *   detailId: string,
   *   imageKey: string,
   *   moved: boolean,
   * } | null} */
  let drag = null;

  const STORAGE_KEY = "xframe-crop-insets";

  const applyCrop = (detailId, x0, y0, cropW, cropH, srcW, srcH) => {
    runtime.crop.set(detailId, {
      cropX: Math.round(x0),
      cropY: Math.round(y0),
      cropW: Math.round(cropW),
      cropH: Math.round(cropH),
      srcW,
      srcH,
    });

  const readStore = () => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
    } catch {
      return {};
    }
  };

  const writeStore = (store) => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    } catch {
      /* private mode / quota */
    }
  };

  const imageKeyForSource = (source) => {
    if (!(source instanceof HTMLImageElement)) return "";
    const keyed = source.getAttribute("data-xframe-image-key")?.trim();
    if (keyed) return keyed;
    const id = source.id?.trim();
    return id ? `media:${id}` : "";

    const frame = callout.closest(".xframe-crop-source-frame");
    const img = frame?.querySelector("img");
    return img instanceof HTMLImageElement ? img : null;
  };

  const parseCropValue = (value) => {
    const parts = String(value || "").split(",").map((part) => Number(part.trim()));
    if (parts.length !== 4 || parts.some((n) => !Number.isFinite(n))) return null;
    const [x0, y0, x1, y1] = parts;
    if (!(x1 > x0 && y1 > y0)) return null;
    return { x0, y0, x1, y1, cropW: x1 - x0, cropH: y1 - y0 };
  };

  const formatCropValue = (x0, y0, cropW, cropH) =>
    `${x0},${y0},${x0 + cropW},${y0 + cropH}`;

  const saveInset = (imageKey, detailId, x0, y0, cropW, cropH, srcW, srcH) => {
    if (!imageKey || !detailId) return;

    const bucket = store[imageKey] && typeof store[imageKey] === "object" ? store[imageKey] : {};

    if (!bucket || typeof bucket !== "object" || !(detailId in bucket)) return;
    delete bucket[detailId];
    if (Object.keys(bucket).length) store[imageKey] = bucket;

    const parsed = parseCropValue(raw);
    if (!parsed) return false;
    if (!calloutForDetail(detailId)) return false;
    const live = runtime.crop.get(detailId);
    const width = srcW || live?.srcW || 0;
    const height = srcH || live?.srcH || 0;
    if (!(width > 0 && height > 0)) return false;
    applyCrop(detailId, parsed.x0, parsed.y0, parsed.cropW, parsed.cropH, width, height);

  const syncDetailFromElement = (detailId) => {
    if (!detailId || !calloutForDetail(detailId)) return;

    applyCropValueToDetail(detailId, raw, 0, 0);

  const restoreInsetsFromStore = (sourceId, imageKey, srcW, srcH) => {
    if (!imageKey || !(srcW > 0 && srcH > 0)) return;

  const restoreFromUrlParams = () => {
    document.querySelectorAll(".xframe-crop[data-xframe-draggable='true']").forEach((callout) => {

      startClientY: event.clientY,

      originY0: box.cropY,

      y0: box.cropY,
      cropW: box.cropW,
      cropH: box.cropH,

        view,

        box,
        imageKey,
        box.cropW,
        box.cropH,
      );

    }

    const callout = event.target.closest(".xframe-crop[data-xframe-draggable='true']");
    if (!(callout instanceof HTMLElement)) return;
    if (callout.closest('[data-layout$="-mobile"]')) return;
    const frame = callout.closest(".xframe-crop-source-frame");
    if (!(frame instanceof HTMLElement)) return;
    const detailId = callout.getAttribute("data-xframe-crop-detail")?.trim();
    const box = runtime.crop.get(detailId);
    if (!detailId || !box || !(box.srcW > 0 && box.srcH > 0 && box.cropW > 0 && box.cropH > 0)) return;
    const source = sourceImageForCallout(callout);
    const imageKey = imageKeyForSource(source);

    const dyPx = ((event.clientY - drag.startClientY) / rect.height) * drag.scaleY;

    const y0 = Math.round(Math.min(maxY0, Math.max(0, drag.originY0 + dyPx)));
    drag.x0 = x0;
    drag.y0 = y0;
    applyCrop(drag.detailId, x0, y0, drag.cropW, drag.cropH, drag.srcW, drag.srcH);

      const detailId = callout instanceof HTMLElement

      const srcW = box?.srcW || img.naturalWidth;
      const srcH = box?.srcH || img.naturalHeight;
      if (srcW > 0 && srcH > 0) restoreInsetsFromStore(sourceId, imageKey, srcW, srcH);

      const detailId = callout.getAttribute("data-xframe-crop-detail")?.trim();
      if (!detailId || cropFromUrl(detailId)) return;
      const box = runtime.crop.get(detailId);
      if (!box) return;
      publishCropParam(detailId, box.cropX, box.cropY, box.cropW, box.cropH);
    });
    document.querySelectorAll(".xframe-crop[data-xframe-crop-detail]").forEach((el) => {
      const id = el.getAttribute("data-xframe-crop-detail")?.trim();
      if (id) runtime.crop.bakeDetail?.(id);
    });
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bootRestore, { once: true });
  } else {
    bootRestore();
  }
});

<script>
window.__XFRAME__.runtime.register("grill_overlay", () => {
  /** @type {Record<string, { w: number, h: number }>} */
  const fallbackSizes = {
    B: { w: 18, h: 15 },
    C: { w: 13, h: 16 },
    D: { w: 12, h: 14 },
    E: { w: 11, h: 13 },
    F: { w: 9, h: 13 },
    G: { w: 9.5, h: 9.5 },
    H: { w: 10, h: 12 },
    I: { w: 8.5, h: 10 },
    J: { w: 7, h: 9.5 },
    Z: { w: 11, h: 14 },
  };

  /** @type {Record<string, { cols: number, rows: number }>} */
  const fallbackPoints = {
    B: { cols: 22, rows: 18 },
    C: { cols: 16, rows: 19 },
    D: { cols: 15, rows: 17 },
    E: { cols: 14, rows: 16 },
    F: { cols: 11, rows: 16 },
    G: { cols: 12, rows: 11 },
    H: { cols: 12, rows: 15 },
    I: { cols: 11, rows: 11 },
    J: { cols: 10, rows: 12 },
    Z: { cols: 13, rows: 18 },
  };

  const ink = "#0b1d36";
  const dotRadius = 0.12;

  const jsonAttr = (ruler, name, fallback) => {
    try {
      const raw = ruler.getAttribute(name);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") return parsed;
      }
    } catch {
      /* use fallback */
    }
    return fallback;
  };

  const sizesFor = (ruler) => jsonAttr(ruler, "data-xframe-grill-sizes", fallbackSizes);
  const pointsFor = (ruler) => jsonAttr(ruler, "data-xframe-grill-points", fallbackPoints);

  const parseGrillId = (value) => {
    const raw = String(value || "").trim();
    const match = raw.match(/^([A-Za-z])(?:(\d{1,2})[x×X](\d{1,2}))?$/);
    if (!match) return raw.toUpperCase();
    const letter = match[1].toUpperCase();
    if (!match[2]) return letter;
    return `${letter}${Number(match[2])}x${Number(match[3])}`;
  };

  const cssNum = (ruler, name) => Number(ruler.style.getPropertyValue(name));

  const roundMm = (n) => (Math.round(n * 1000) / 1000).toString();

  const dotsMarkup = (size, points) => {
    const pitchX = size.w / points.cols;
    const pitchY = size.h / points.rows;
    const circles = [];
    for (let row = 0; row < points.rows; row++) {
      for (let col = 0; col < points.cols; col++) {
        const cx = roundMm((col + 0.5) * pitchX);
        const cy = roundMm((row + 0.5) * pitchY);

    if (!(spanMm > 0) || !(extentMm > 0)) return 0;
    const raw = (spanMm - extentMm) / 2;
    const step = Number.isInteger(extentMm) ? 1 : 0.5;
    const max = Math.max(0, spanMm - extentMm);
    const snapped = Math.round(raw / step) * step;
    return Math.min(max, Math.max(0, snapped));

  const silhouetteMarkup = (letter, size, points) => {
    const stroke = 0.35;

    const w = size.w;
    const h = size.h;
    const pad = stroke;
    const body = letter === "F"
      ? `<path fill="none" stroke="${ink}" stroke-width="${stroke}" stroke-linecap="square" d="M ${-o},${-o} H ${w + o} V ${h * 0.43} M ${w + o},${h * 0.57} V ${h + o} H ${-o} V ${-o}"/>`
      : `<rect x="${-o}" y="${-o}" width="${w + stroke}" height="${h + stroke}" fill="none" stroke="${ink}" stroke-width="${stroke}"/>`;
    return [
      `<svg class="xframe-grill-overlay" viewBox="${-pad} ${-pad} ${w + 2 * pad} ${h + 2 * pad}"`,

      body,
      dotsMarkup(size, points),

    ].join("");

    if (!(ruler instanceof HTMLElement)) return;
    const view = ruler.querySelector(".xframe-mm-ruler-view");
    if (!(view instanceof HTMLElement)) return;
    const existing = view.querySelector(".xframe-grill-overlay");
    if (existing) existing.remove();

    if (!optionId) {
      ruler.removeAttribute("data-xframe-grill");
      ruler.style.removeProperty("--xframe-grill-w-mm");
      ruler.style.removeProperty("--xframe-grill-h-mm");
      ruler.style.removeProperty("--xframe-grill-x-mm");
      ruler.style.removeProperty("--xframe-grill-y-mm");
      return;
    }

    const id = parseGrillId(optionId);
    const letter = id.charAt(0);
    const sizes = sizesFor(ruler);
    const size = sizes[letter];
    if (!size) return;
    const pointsTable = pointsFor(ruler);
    const points = pointsTable[id] || fallbackPoints[letter];
    if (!points) return;

    const dpi = cssNum(ruler, "--xframe-dpi");
    const spanX = cssNum(ruler, "--xframe-span-x");
    const spanY = cssNum(ruler, "--xframe-span-y");
    const authored = ruler.getAttribute("data-xframe-grill-offset")?.trim();
    let xMm;
    let yMm;
    if (authored && authored !== "auto") {
      const parts = authored.split(/[,\s]+/).map(Number);
      xMm = Number.isFinite(parts[0]) ? parts[0] : 0;
      yMm = Number.isFinite(parts[1]) ? parts[1] : 0;
    } else if (dpi > 0 && spanX > 0 && spanY > 0) {
      const spanMmX = (spanX * 25.4) / dpi;
      const spanMmY = (spanY * 25.4) / dpi;
      xMm = snapOffsetMm(spanMmX, size.w);
      yMm = snapOffsetMm(spanMmY, size.h);
    } else {
      xMm = 0;
      yMm = 0;
    }

    ruler.setAttribute("data-xframe-grill", id);
    ruler.style.setProperty("--xframe-grill-w-mm", String(size.w));
    ruler.style.setProperty("--xframe-grill-h-mm", String(size.h));
    ruler.style.setProperty("--xframe-grill-x-mm", String(xMm));
    ruler.style.setProperty("--xframe-grill-y-mm", String(yMm));
    ruler.style.setProperty("--xframe-grill-stroke-mm", "0.35");
    view.insertAdjacentHTML("beforeend", silhouetteMarkup(letter, size, points));
  };

  const enableCheckbox = (ruler) => {
    const box = ruler.querySelector(".xframe-grill-enable-checkbox");
    return box instanceof HTMLInputElement ? box : null;
  };

  const typeSelect = (ruler) => {
    const select = ruler.querySelector("select.xframe-grill-picker-select");
    return select instanceof HTMLSelectElement ? select : null;
  };

  const firstTypeOption = (select) => {
    if (!(select instanceof HTMLSelectElement)) return "";
    for (const option of select.options) {
      const value = parseGrillId(option.value);
      if (value) return value;
    }
    return "";
  };

  document.addEventListener("change", (event) => {
    if (!(event.target instanceof Element)) return;

    const enable = event.target.closest(".xframe-grill-enable-checkbox");
    if (enable instanceof HTMLInputElement) {
      const ruler = enable.closest(".xframe-mm-ruler");
      if (!(ruler instanceof HTMLElement)) return;
      const select = typeSelect(ruler);
      if (!enable.checked) {
        const prev = parseGrillId(select?.value || ruler.getAttribute("data-xframe-grill") || "");
        if (prev) ruler.setAttribute("data-xframe-grill-restore", prev);
        if (select) select.value = "";
        applyGrill(ruler, "");
        return;
      }
      const restore = parseGrillId(
        ruler.getAttribute("data-xframe-grill-restore")
        || select?.value
        || firstTypeOption(select)
        || ruler.getAttribute("data-xframe-grill")
        || "",
      );
      if (select && restore) select.value = restore;
      applyGrill(ruler, restore);
      return;
    }

    const select = event.target.closest("select.xframe-grill-picker-select");
    if (!(select instanceof HTMLSelectElement)) return;
    const ruler = select.closest(".xframe-mm-ruler");
    if (!(ruler instanceof HTMLElement)) return;
    const optionId = parseGrillId(select.value);
    const enableBox = enableCheckbox(ruler);
    if (enableBox) enableBox.checked = Boolean(optionId);
    if (optionId) ruler.setAttribute("data-xframe-grill-restore", optionId);
    applyGrill(ruler, optionId || "");
  });

  // Keep lightbox controls from closing the overlay or starting a crop pan.
  document.addEventListener("pointerdown", (event) => {
    if (!(event.target instanceof Element)) return;
    if (!event.target.closest(".xframe-zoom-ruler .xframe-grill-picker")) return;
    event.stopPropagation();
  }, true);
});
</script>

<script>
window.__XFRAME__.runtime.register("hud", (runtime) => {
  const root = document.getElementById("xframe");
  if (!root) return;

  const slides = [...root.querySelectorAll(".segment")];
  const hud = document.getElementById("xframe-hud");
  const frameHost = root.querySelector(".xframe-frame-host");
  const frame = document.getElementById("xframe-frame");
  const deck = document.getElementById("xframe-deck");
  const button = (selector) => {
    const element = hud?.querySelector(selector);
    return element instanceof HTMLButtonElement ? element : null;
  };
  const counter = hud?.querySelector("[data-deck-counter]");
  const screenshotButton = button("[data-deck-screenshot]");
  const previousButton = button("[data-deck-previous]");
  const nextButton = button("[data-deck-next]");
  const themeButton = button("[data-deck-theme]");
  const formatButton = button("[data-deck-format]");
  const fullscreenButton = button("[data-deck-fullscreen]");
  const deckThemes = (hud?.dataset.themes || root.dataset.themes || "")
    .split(",").map((name) => name.trim()).filter(Boolean);
  const deckFormats = (hud?.dataset.formats || document.body.dataset.xframeFormats || "")
    .split(",").map((name) => name.trim()).filter(Boolean);
  const lastIndex = Math.max(slides.length - 1, 0);
  const clampIndex = (value) => Math.min(Math.max(value, 0), lastIndex);
  let index = -1;

  const fromHash = () => {
    const value = Number.parseInt(location.hash.slice(1), 10);
    return Number.isNaN(value) ? 0 : clampIndex(value - 1);
  };

  const canvasSize = () => {
    const styles = getComputedStyle(document.documentElement);
    const w = Number.parseFloat(styles.getPropertyValue("--canvas-w"));
    const h = Number.parseFloat(styles.getPropertyValue("--canvas-h"));
    return {
      w: Number.isFinite(w) && w > 0 ? w : (frame?.offsetWidth || root.offsetWidth || 1),
      h: Number.isFinite(h) && h > 0 ? h : (frame?.offsetHeight || root.offsetHeight || 1),
    };
  };

  const isFullscreen = () => Boolean(document.fullscreenElement);

  const syncFullscreenBackdrop = () => {
    const doc = document.documentElement;
    const body = document.body;
    if (!isFullscreen()) {
      doc.style.background = "";
      body.style.background = "";
      return;
    }
    const active = slides.find((slide) => slide.classList.contains("active"));
    const source = active instanceof HTMLElement ? active : (frame || root);
    const canvasBg = getComputedStyle(source).backgroundColor;
    if (canvasBg && canvasBg !== "rgba(0, 0, 0, 0)") {
      doc.style.background = canvasBg;
      body.style.background = canvasBg;
    }
  };

  const clearChromeAlignment = () => {
    const chrome = document.getElementById("xframe-chrome");
    if (!(chrome instanceof HTMLElement)) return;
    chrome.style.removeProperty("--frame-scale");
    chrome.style.removeProperty("--frame-left");
    chrome.style.removeProperty("--frame-width");
    chrome.style.removeProperty("--frame-bottom");
  };

  const syncChromeAlignment = (isFs) => {
    if (!root.dataset.xframeCanvas) return;
    const chrome = document.getElementById("xframe-chrome");
    const measure = frame instanceof HTMLElement ? frame : frameHost;
    if (!(chrome instanceof HTMLElement) || !(measure instanceof HTMLElement)) return;
    const { w } = canvasSize();
    const frameRect = measure.getBoundingClientRect();
    const chromeRect = chrome.getBoundingClientRect();
    const scaledW = frameRect.width;
    const scale = w > 0 ? scaledW / w : 1;
    chrome.style.setProperty("--frame-scale", String(scale));
    chrome.style.setProperty("--frame-width", `${scaledW}px`);
    if (isFs) {
      chrome.style.setProperty("--frame-left", `${frameRect.left - chromeRect.left}px`);
      chrome.style.setProperty("--frame-bottom", `${frameRect.bottom - chromeRect.top}px`);
    } else {
      chrome.style.setProperty("--frame-left", `${Math.max((chrome.offsetWidth - scaledW) / 2, 0)}px`);
      chrome.style.removeProperty("--frame-bottom");
    }
  };

  const clearCanvasFitOverrides = () => {
    if (frame instanceof HTMLElement) {
      frame.style.width = "";
      frame.style.height = "";
      frame.style.transformOrigin = "";
      frame.style.transform = "";
    }
    if (frameHost instanceof HTMLElement) {
      frameHost.style.width = "";
      frameHost.style.height = "";
    }
    root.style.transform = "";
    root.style.transformOrigin = "";
    clearChromeAlignment();
  };

  const syncWindowedChromeAlignment = () => {
    syncChromeAlignment(false);
  };

  const syncWindowedCanvasFit = () => {
    syncChromeHeight();
    syncWindowedChromeAlignment();
    syncChromeHeight();
    syncWindowedChromeAlignment();
  };

  const syncFullscreenCanvasSize = () => {
    const { w, h } = canvasSize();
    const availW = Math.max(window.innerWidth, 1);
    const availH = Math.max(window.innerHeight, 1);
    const scale = Math.min(availW / w, availH / h);
    const offsetX = (availW - w * scale) / 2;
    const offsetY = (availH - h * scale) / 2;

    if (frame instanceof HTMLElement) {
      frame.style.width = `${w}px`;
      frame.style.height = `${h}px`;
      frame.style.transformOrigin = "top left";
      frame.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    }

    syncChromeAlignment(true);
  };

  const syncChromeHeight = () => {
    if (!root.dataset.xframeCanvas) return;
    const chrome = document.getElementById("xframe-chrome");
    if (!(chrome instanceof HTMLElement)) return;
    const chromeH = isFullscreen() ? 0 : chrome.offsetHeight;
    document.documentElement.style.setProperty(
      "--xframe-chrome-h",
      chromeH > 0 ? `${chromeH + 24}px` : "",
    );
  };

  const fitCanvas = () => {
    if (isFullscreen()) {
      syncFullscreenBackdrop();
      document.documentElement.dataset.xframeFullscreen = "";
      clearCanvasFitOverrides();

      if (root.dataset.xframeCanvas) {
        syncFullscreenCanvasSize();
        syncFullscreenBackdrop();
        return;
      }

      const { w, h } = canvasSize();
      const padX = 20;
      const padTop = 28;
      const padBottom = 56;
      const availW = Math.max(window.innerWidth - padX * 2, 1);
      const availH = Math.max(window.innerHeight - padTop - padBottom, 1);
      const scale = Math.max(availW / w, availH / h);
      root.style.transformOrigin = "center center";
      root.style.transform = "scale(" + scale + ")";
      return;
    }

    delete document.documentElement.dataset.xframeFullscreen;
    syncFullscreenBackdrop();
    clearCanvasFitOverrides();

    if (root.dataset.xframeCanvas) {
      syncWindowedCanvasFit();
      return;
    }

    const { w, h } = canvasSize();
    syncChromeHeight();
    const chrome = hud ? hud.offsetHeight + 16 : 0;
    const scale = Math.min((window.innerWidth * 0.92) / w, (window.innerHeight * 0.82) / (h + chrome), 1);
    root.style.transform = "scale(" + scale + ")";
  };
  let fitFrame = 0;
  const scheduleCanvasFit = () => {
    if (fitFrame) return;
    fitFrame = requestAnimationFrame(() => {
      fitFrame = 0;
      fitCanvas();
    });
  };

  const applyTheme = (name) => {
    if (!name) return;
    root.dataset.theme = name;
    slides.forEach((slide) => { slide.dataset.theme = name; });
    document.documentElement.dataset.theme = name;
  };

  const show = (nextIndex, source = "api") => {
    const previousIndex = index;
    index = clampIndex(nextIndex);
    if (previousIndex !== index) {
      slides[previousIndex]?.classList.remove("active");
      slides[index]?.classList.add("active");
    }
    if (counter) counter.textContent = (index + 1) + " / " + Math.max(slides.length, 1);
    if (previousButton) previousButton.disabled = index === 0;
    if (nextButton) nextButton.disabled = index >= slides.length - 1;
    const hash = "#" + (index + 1);
    if (hash !== location.hash) {
      try {
        history.replaceState(null, "", `${location.pathname}${location.search}${hash}`);
      } catch {}
    }
    root.dispatchEvent(new CustomEvent("xframe:slidechange", { detail: { index, source } }));
    if (isFullscreen()) syncFullscreenBackdrop();
    scheduleCanvasFit();
  };

  const cycleTheme = () => {
    if (deckThemes.length < 2) return;
    const current = root.dataset.theme || deckThemes[0];
    const at = deckThemes.indexOf(current);
    const nextTheme = deckThemes[(at < 0 ? 0 : at + 1) % deckThemes.length];
    applyTheme(nextTheme);
    if (isFullscreen()) syncFullscreenBackdrop();
  };

  const cycleFormat = () => {
    if (deckFormats.length < 2) return;
    const current = document.body.dataset.xframeFormat
      || document.documentElement.dataset.xframeFormat
      || deckFormats[0];
    const at = deckFormats.indexOf(current);
    const next = deckFormats[(at < 0 ? 0 : at + 1) % deckFormats.length];
    try { localStorage.setItem("xframe-format", next); } catch {}
    location.reload();
  };

  const updateFullscreenControl = () => {
    if (!fullscreenButton) return;
    const active = isFullscreen();
    fullscreenButton.textContent = active ? "⤢" : "⛶";
    fullscreenButton.title = active ? "Exit full screen (f)" : "Enter full screen (f)";
    fullscreenButton.setAttribute("aria-label", active ? "Exit full screen" : "Enter full screen");
  };

  const toggleFullscreen = async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else if (root.dataset.xframeCanvas && deck instanceof HTMLElement) {
        await deck.requestFullscreen();
      } else {
        await document.documentElement.requestFullscreen();
      }
    } catch {}
  };

  const stylesheetText = () => {
    const css = [];
    for (const sheet of document.styleSheets) {
      try {
        css.push([...sheet.cssRules]
          .filter((rule) => rule.type !== CSSRule.IMPORT_RULE)
          .map((rule) => rule.cssText)
          .join("\n"));
      } catch {}
    }
    return css.join("\n");
  };

  const canvasBlob = (canvas) => new Promise((resolve, reject) => {
    canvas.toBlob((blob) => {
      if (blob) resolve(blob);
      else reject(new Error("Could not encode slide image"));
    }, "image/png");
  });

  const renderSlideImage = async () => {
    const { w, h } = canvasSize();
    const copy = root.cloneNode(true);
    if (!(copy instanceof HTMLElement)) throw new Error("Could not copy slide");
    copy.querySelector("#xframe-chrome")?.remove();
    copy.querySelectorAll(".xframe-narrative-dock, .layout-controls").forEach((element) => element.remove());
    copy.querySelectorAll(".xframe-ai-index-control").forEach((element) => {
      if (!(element instanceof HTMLElement)) return;
      element.style.filter = "none";
      element.style.backdropFilter = "none";
      element.style.boxShadow = "none";
    });
    copy.querySelectorAll(".segment").forEach((slide, slideIndex) => {
      slide.classList.toggle("active", slideIndex === index);
    });
    copy.style.width = `${w}px`;
    copy.style.height = `${h}px`;
    copy.style.maxWidth = "none";
    copy.style.maxHeight = "none";
    copy.style.overflow = "hidden";
    copy.style.transform = "none";
    copy.style.transformOrigin = "top left";
    const copyHost = copy.querySelector(".xframe-frame-host");
    if (copyHost instanceof HTMLElement) {
      copyHost.style.width = `${w}px`;
      copyHost.style.height = `${h}px`;
      copyHost.style.maxWidth = "none";
    }
    const copyFrame = copy.querySelector("#xframe-frame");
    if (copyFrame instanceof HTMLElement) {
      copyFrame.style.width = `${w}px`;
      copyFrame.style.height = `${h}px`;
      copyFrame.style.transform = "none";
    }

    // A foreignObject clone cannot reliably resolve blob/object URLs (and some
    // same-origin image URLs). Bake every drawable live image into its matching
    // clone so full replacement images survive alongside already-baked crops.
    const liveImages = [...root.querySelectorAll("img")];
    const copiedImages = [...copy.querySelectorAll("img")];
    liveImages.forEach((live, imageIndex) => {
      const cloned = copiedImages[imageIndex];
      if (!(live instanceof HTMLImageElement) || !(cloned instanceof HTMLImageElement)) return;
      const src = live.currentSrc || live.getAttribute("src") || "";
      if (!src || src.startsWith("data:") || !(live.naturalWidth > 0 && live.naturalHeight > 0)) return;
      const bitmap = document.createElement("canvas");
      bitmap.width = live.naturalWidth;
      bitmap.height = live.naturalHeight;
      try {
        const bitmapContext = bitmap.getContext("2d");
        if (!bitmapContext) return;
        bitmapContext.drawImage(live, 0, 0);
        cloned.removeAttribute("srcset");
        cloned.removeAttribute("data-src");
        cloned.src = bitmap.toDataURL("image/png");
      } catch {
        // Cross-origin servers may forbid canvas reads; retain the original URL.
      }
    });

    const wrapper = document.createElement("div");
    wrapper.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
    wrapper.style.width = `${w}px`;
    wrapper.style.height = `${h}px`;
    wrapper.style.overflow = "hidden";
    const styles = document.createElement("style");
    styles.textContent = `${stylesheetText()}\n*, *::before, *::after { animation: none !important; transition: none !important; }`;
    wrapper.append(styles);
    wrapper.append(copy);

    const serialized = new XMLSerializer().serializeToString(wrapper);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject width="100%" height="100%">${serialized}</foreignObject></svg>`;
    const image = new Image();
    image.decoding = "async";
    image.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    await image.decode();
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(w);
    canvas.height = Math.round(h);
    const context = canvas.getContext("2d");
    if (!context) throw new Error("Canvas is unavailable");
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    return await canvasBlob(canvas);
  };

  const copySlideImage = async () => {
    if (!screenshotButton || !navigator.clipboard?.write || typeof ClipboardItem === "undefined") return;
    screenshotButton.disabled = true;
    try {
      const image = renderSlideImage();
      await navigator.clipboard.write([new ClipboardItem({ "image/png": image })]);
      screenshotButton.textContent = "✓";
      screenshotButton.title = "Slide image copied";
    } catch (error) {
      console.error("Could not copy slide image", error);
      screenshotButton.textContent = "!";
      screenshotButton.title = "Could not copy slide image";
    } finally {
      window.setTimeout(() => {
        screenshotButton.textContent = "📷";
        screenshotButton.title = "Copy slide image";
        screenshotButton.disabled = false;
      }, 1400);
    }
  };

  const isEditing = (target) => target instanceof HTMLInputElement
    || target instanceof HTMLTextAreaElement
    || target instanceof HTMLSelectElement
    || (target instanceof HTMLElement
      && (target.isContentEditable || Boolean(target.closest("[contenteditable='true']"))));

  previousButton?.addEventListener("click", () => show(index - 1, "manual"));
  screenshotButton?.addEventListener("click", copySlideImage);
  nextButton?.addEventListener("click", () => show(index + 1, "manual"));
  themeButton?.addEventListener("click", cycleTheme);
  formatButton?.addEventListener("click", cycleFormat);
  fullscreenButton?.addEventListener("click", toggleFullscreen);
  window.addEventListener("keydown", (event) => {
    if (isEditing(event.target)) return;
    switch (event.key) {
      case "ArrowRight":
      case "PageDown":
      case " ":
        event.preventDefault();
        show(index + 1, "manual");
        break;
      case "ArrowLeft":
      case "PageUp":
        event.preventDefault();
        show(index - 1, "manual");
        break;
      case "Home": show(0, "manual"); break;
      case "End": show(lastIndex, "manual"); break;
      case "t": cycleTheme(); break;
      case "f": toggleFullscreen(); break;
    }
  });
  window.addEventListener("hashchange", () => show(fromHash(), "hash"));
  window.addEventListener("resize", scheduleCanvasFit, { passive: true });
  document.addEventListener("fullscreenchange", () => {
    updateFullscreenControl();
    requestAnimationFrame(() => scheduleCanvasFit());
  });

  if (themeButton) {
    themeButton.disabled = deckThemes.length < 2;
    themeButton.hidden = deckThemes.length < 1;
  }
  if (formatButton) {
    formatButton.hidden = deckFormats.length < 2;
    formatButton.disabled = deckFormats.length < 2;
  }
  if (screenshotButton && (!navigator.clipboard?.write || typeof ClipboardItem === "undefined")) {
    screenshotButton.hidden = true;
  }
  applyTheme(root.dataset.theme || deckThemes[0]);
  show(fromHash());
  updateFullscreenControl();
  fitCanvas();
  return {
    get index() { return index; },
    get count() { return slides.length; },
    goTo(nextIndex, source = "api") {
      show(nextIndex, source);
      return index;
    },
    next(source = "api") {
      if (index >= lastIndex) return false;
      show(index + 1, source);
      return true;
    },
    previous(source = "api") {
      if (index <= 0) return false;
      show(index - 1, source);
      return true;
    },
  };
});
</script>

<script>
window.__XFRAME__.runtime.register("language", (runtime) => {
  const STORAGE_KEY = "xframe-narrative-language";
  let languageNames;

  const displayName = (locale) => {
    try {
      languageNames ||= new Intl.DisplayNames(["en"], { type: "language" });
      const primary = locale.split("-")[0] || locale;
      return languageNames.of(primary) || locale;
    } catch {
      return locale;
    }
  };

  const uniqueLocales = (voices) => {
    const byLanguage = new Map();
    for (const voice of voices) {
      const locale = String(voice.lang || "").trim();
      if (!locale) continue;
      const language = locale.split("-")[0].toLowerCase();
      const existing = byLanguage.get(language);
      if (!existing) {
        byLanguage.set(language, locale);
        continue;
      }
      // Prefer region-qualified English locales (en-US) when available.
      if (language === "en" && !existing.includes("-") && locale.includes("-")) {
        byLanguage.set(language, locale);
      }
    }
    return [...byLanguage.values()].sort((a, b) => {
      const la = displayName(a);
      const lb = displayName(b);
      return la.localeCompare(lb) || a.localeCompare(b);
    });
  };

  const pickDefault = (locales) => {
    const english = locales.find((code) => code.toLowerCase() === "en-us")
      || locales.find((code) => code.toLowerCase() === "en")
      || locales.find((code) => code.toLowerCase().startsWith("en-"));
    return english || locales[0] || "en-US";
  };

  const loadStored = () => {
    try { return localStorage.getItem(STORAGE_KEY) || ""; } catch { return ""; }
  };

  const resolveSelection = (locales, requested) => {
    if (!requested) return pickDefault(locales);
    const exact = locales.find((code) => code.toLowerCase() === requested.toLowerCase());
    if (exact) return exact;
    const primary = requested.split("-")[0]?.toLowerCase() ?? "";
    return locales.find((code) => code.toLowerCase() === primary || code.toLowerCase().startsWith(primary + "-"))
      || pickDefault(locales);
  };

  const applyLanguage = (locale, { persist = true, source } = {}) => {
    const root = document.getElementById("xframe");
    const hud = document.getElementById("xframe-hud");
    if (!root || !locale) return;
    const language = locale.split("-")[0] || locale;
    root.dataset.narrationLanguage = locale;
    root.dataset.narrationLocale = locale;
    for (const select of root.querySelectorAll("[data-xframe-language-select]")) {
      if (!(select instanceof HTMLSelectElement)) continue;
      if (![...select.options].some((option) => option.value === locale)) {
        const option = document.createElement("option");
        option.value = locale;
        option.textContent = displayName(locale);
        select.append(option);
      }
      select.value = locale;
    }
    hud?.querySelectorAll("[data-narrative-language-button]").forEach((button) => {
      if (!(button instanceof HTMLButtonElement)) return;
      const code = button.dataset.narrativeLanguageButton ?? "";
      const primary = language.toLowerCase();
      const pressed = code === locale
        || code.toLowerCase() === primary
        || code.toLowerCase().startsWith(primary + "-");
      button.setAttribute("aria-pressed", String(pressed));
    });
    if (persist) {
      try { localStorage.setItem(STORAGE_KEY, locale); } catch {}
    }
    root.dispatchEvent(new CustomEvent("xframe:languagechange", {
      bubbles: true,
      detail: { language, locale, source: source || "control" },
    }));
  };

  const populate = () => {
    if (!("speechSynthesis" in window)) return;
    const root = document.getElementById("xframe");
    if (!root) return;
    const selects = [...root.querySelectorAll("[data-xframe-language-select]")]
      .filter((el) => el instanceof HTMLSelectElement);
    if (!selects.length) return;
    const locales = uniqueLocales(speechSynthesis.getVoices());
    if (!locales.length) return;
    const selected = resolveSelection(locales, loadStored() || root.dataset.narrationLanguage || "en-US");
    for (const select of selects) {
      select.replaceChildren();
      for (const locale of locales) {
        const option = document.createElement("option");
        option.value = locale;
        option.textContent = displayName(locale);
        select.append(option);
      }
      select.value = selected;
      if (!select.dataset.xframeLanguageWired) {
        select.dataset.xframeLanguageWired = "true";
        select.addEventListener("change", () => applyLanguage(select.value, { source: "control" }));
      }
    }
    applyLanguage(selected, { persist: true, source: "init" });
  };

  populate();
  if ("speechSynthesis" in window) {
    speechSynthesis.addEventListener("voiceschanged", populate);
  }
  document.addEventListener("click", (event) => {
    const button = event.target instanceof Element
      ? event.target.closest("[data-narrative-language-button]")
      : null;
    if (!(button instanceof HTMLButtonElement)) return;
    const language = button.dataset.narrativeLanguageButton;
    if (language) applyLanguage(language, { source: "narrative-button" });
  });

  return { applyLanguage, displayName };
});
</script>

<script>
window.__XFRAME__.runtime.register("narrative", { import: ["language.applyLanguage"] }, (runtime) => {
  const root = document.getElementById("xframe");
  const dock = document.getElementById("xframe-narrative-dock");
  if (!root || !dock) return;

  const slides = [...dock.querySelectorAll("[data-xframe-narrative-slide]")]
    .filter((node) => node instanceof HTMLElement);
  const widgets = [...dock.querySelectorAll("[data-xframe-narrative]")]
    .filter((node) => node instanceof HTMLElement)
    .map((node) => ({
      root: node,
      entries: [...node.querySelectorAll("[data-narrative-language]")]
        .filter((entry) => entry instanceof HTMLElement),
      audios: [...node.querySelectorAll("audio[data-narrative-audio]")]
        .filter((audio) => audio instanceof HTMLAudioElement),
      soundbite: node.querySelector("[data-narrative-soundbite]"),
    }));
  let playbackId = 0;
  let currentAudio = null;
  let soundbiteToken = 0;

  const primary = (locale) => locale.split("-")[0] ?? locale;

  const pickLocale = (requested, codes) => {
    if (!codes.length || !requested) return codes[0] ?? "";
    if (codes.includes(requested)) return requested;
    const stem = primary(requested);
    return codes.find((code) => code === stem || code.startsWith(stem + "-")) ?? codes[0];
  };

  const syncDock = (locale) => {
    if (!locale) return;
    for (const widget of widgets) {
      const codes = widget.entries
        .map((entry) => entry.dataset.narrativeLanguage ?? "")
        .filter(Boolean);
      const selected = pickLocale(locale, codes);
      if (!selected) continue;
      widget.root.dataset.selectedLanguage = selected;
      for (const entry of widget.entries) {
        const active = entry.dataset.narrativeLanguage === selected;
        entry.hidden = !active;
        if (active) entry.dataset.selected = "true";
        else delete entry.dataset.selected;
      }
      for (const audio of widget.audios) {
        const sameLanguage = audio.dataset.narrativeLanguage === selected;
        const part = Number(audio.dataset.narrativePart ?? 0);
        const active = sameLanguage && part === 0;
        if (!sameLanguage) audio.pause();
        audio.hidden = !active;
      }
    }
  };

  const showSlide = (index) => {
    for (const slide of slides) {
      const active = Number(slide.dataset.xframeNarrativeSlide) === index;
      slide.hidden = !active;
      if (!active) slide.querySelectorAll("audio").forEach((audio) => audio.pause());
    }
  };

  const stop = () => {
    playbackId += 1;
    soundbiteToken += 1;
    currentAudio = null;
    for (const widget of widgets) {
      for (const audio of widget.audios) {
        audio.pause();
        try { audio.currentTime = 0; } catch {}
      }
      const button = widget.soundbite;
      if (button instanceof HTMLButtonElement) {
        button.setAttribute("aria-pressed", "false");
      }
    }
  };

  const playOne = (audio, id) => new Promise((resolve) => {
    if (audio.dataset.src && !audio.getAttribute("src")) {
      audio.src = audio.dataset.src;
    }
    let settled = false;
    const finish = (played) => {
      if (settled) return;
      settled = true;
      audio.removeEventListener("ended", ended);
      audio.removeEventListener("error", failed);
      resolve(played);
    };
    const ended = () => finish(true);
    const failed = () => finish(false);
    audio.addEventListener("ended", ended, { once: true });
    audio.addEventListener("error", failed, { once: true });
    currentAudio = audio;
    audio.play().catch(failed);
    const watch = () => {
      if (id !== playbackId) finish(false);
      else if (!settled) requestAnimationFrame(watch);
    };
    requestAnimationFrame(watch);
  });

  const play = async (index) => {
    stop();
    const id = playbackId;
    const slide = slides.find(
      (node) => Number(node.dataset.xframeNarrativeSlide) === index,
    );
    if (!slide) return false;
    const widget = slide.querySelector("[data-xframe-narrative]");
    const locale = widget instanceof HTMLElement ? (widget.dataset.selectedLanguage ?? "") : "";
    const matchingAudios = (root) => [...root.querySelectorAll("audio[data-narrative-audio]")]
      .filter((audio) => audio instanceof HTMLAudioElement)
      .filter((audio) => !locale || audio.dataset.narrativeLanguage === locale)
      .sort((left, right) =>
        Number(left.dataset.narrativePart ?? 0) - Number(right.dataset.narrativePart ?? 0));
    let audios = matchingAudios(slide);
    if (!audios.length) {
      const speak = slide.querySelector("[data-narrative-speak]:not([hidden])");
      if (speak instanceof HTMLButtonElement
        && speak.dataset.xframeSpeakState === "ready") {
        speak.dataset.xframeWalkthroughRequested = "true";
        speak.click();
        const started = performance.now();
        let synthesisStarted = false;
        await new Promise((resolve) => {
          const check = () => {
            const generated = slide.querySelector(
              "audio[data-narrative-audio][data-xframe-gemini-tts]",
            );
            synthesisStarted ||= speak.dataset.xframeTtsBusy === "true";
            if (generated instanceof HTMLAudioElement
              || id !== playbackId
              || (synthesisStarted && speak.dataset.xframeTtsBusy !== "true")
              || performance.now() - started >= 60000) {
              resolve();
              return;
            }
            requestAnimationFrame(check);
          };
          requestAnimationFrame(check);
        });
        audios = matchingAudios(slide);
      }
    }
    if (!audios.length) return false;
    let played = false;
    for (const audio of audios) {
      if (id !== playbackId) return played;
      for (const other of audios) other.hidden = other !== audio;
      played = (await playOne(audio, id)) || played;
    }
    if (id === playbackId) currentAudio = null;
    return played;
  };

  const pause = () => currentAudio?.pause();
  const resume = async () => {
    if (!currentAudio || !currentAudio.paused) return false;
    try {
      await currentAudio.play();
      return true;
    } catch {
      return false;
    }
  };

  const parseSoundbiteRanges = (button) => {
    const raw = button?.dataset.narrativeSoundbiteRanges ?? "";
    if (!raw) return [];
    try {
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed)
        ? parsed.filter((range) =>
          range
          && typeof range.start === "number"
          && typeof range.end === "number"
          && range.end > range.start)
        : [];
    } catch {
      return [];
    }
  };

  const ensureAudioSrc = (audio) => {
    if (audio.dataset.src && !audio.getAttribute("src")) {
      audio.src = audio.dataset.src;
    }
  };

  const waitForSeek = (audio) => new Promise((resolve) => {
    if (audio.readyState >= 1) {
      resolve();
      return;
    }
    const ready = () => {
      audio.removeEventListener("loadedmetadata", ready);
      audio.removeEventListener("error", ready);
      resolve();
    };
    audio.addEventListener("loadedmetadata", ready, { once: true });
    audio.addEventListener("error", ready, { once: true });
  });

  const playSoundbiteRange = (audio, range, token) => new Promise((resolve) => {
    ensureAudioSrc(audio);
    let settled = false;
    const finish = (played) => {
      if (settled) return;
      settled = true;
      audio.removeEventListener("timeupdate", onTimeUpdate);
      audio.removeEventListener("ended", onEnded);
      audio.removeEventListener("error", onError);
      try { audio.pause(); } catch {}
      resolve(played);
    };
    const onTimeUpdate = () => {
      if (token !== soundbiteToken) finish(false);
      else if (audio.currentTime >= range.end) finish(true);
    };
    const onEnded = () => finish(true);
    const onError = () => finish(false);
    waitForSeek(audio).then(() => {
      if (token !== soundbiteToken) {
        finish(false);
        return;
      }
      try { audio.currentTime = range.start; } catch {
        finish(false);
        return;
      }
      currentAudio = audio;
      audio.addEventListener("timeupdate", onTimeUpdate);
      audio.addEventListener("ended", onEnded, { once: true });
      audio.addEventListener("error", onError, { once: true });
      audio.play().catch(onError);
    });
  });

  const playSoundbites = async (button) => {
    const ranges = parseSoundbiteRanges(button);
    if (!ranges.length || !(button instanceof HTMLButtonElement)) return false;
    const widget = button.closest("[data-xframe-narrative]");
    if (!(widget instanceof HTMLElement)) return false;
    const locale = widget.dataset.selectedLanguage ?? "";
    const audio = [...widget.querySelectorAll("audio[data-narrative-audio]")]
      .find((candidate) =>
        candidate instanceof HTMLAudioElement
        && !candidate.hidden
        && (!locale || candidate.dataset.narrativeLanguage === locale));
    if (!(audio instanceof HTMLAudioElement)) return false;

    stop();
    const token = soundbiteToken;
    button.setAttribute("aria-pressed", "true");
    let played = false;
    for (const range of ranges) {
      if (token !== soundbiteToken) break;
      played = (await playSoundbiteRange(audio, range, token)) || played;
    }
    if (token === soundbiteToken) {
      currentAudio = null;
      button.setAttribute("aria-pressed", "false");
    }
    return played;
  };

  for (const widget of widgets) {
    const button = widget.soundbite;
    if (button instanceof HTMLButtonElement) {
      button.addEventListener("click", () => {
        void playSoundbites(button);
      });
    }
  }

  root.addEventListener("xframe:languagechange", (event) => {
    const locale = event instanceof CustomEvent
      ? String(event.detail?.locale || event.detail?.language || "")
      : "";
    syncDock(locale);
  });

  root.addEventListener("xframe:slidechange", (event) => {
    const index = event instanceof CustomEvent ? Number(event.detail?.index) : 0;
    if (event instanceof CustomEvent && event.detail?.source !== "walkthrough") stop();
    showSlide(Number.isFinite(index) ? index : 0);
  });

  const active = root.querySelector(".segment.active");
  showSlide(active instanceof HTMLElement ? Number(active.dataset.index ?? 0) : 0);

  const initial = root.dataset.narrationLocale
    || root.dataset.narrationLanguage
    || document.getElementById("xframe-hud")
      ?.querySelector("[data-narrative-language-button]")
      ?.dataset.narrativeLanguageButton;
  if (initial) runtime.language.applyLanguage(initial, { persist: false, source: "narrative-init" });
  return { play, pause, resume, stop };
});
</script>

<script>
window.__XFRAME__.runtime.register("walkthrough", { import: ["hud.goTo"] }, (runtime) => {
  const root = document.getElementById("xframe");
  const button = document.querySelector("[data-deck-walkthrough]");
  if (!root || !(button instanceof HTMLButtonElement)) return;

  const configuredPauseSeconds = Number(root.dataset.xframeWalkthroughPause);
  const TRANSITION_PAUSE_MS = (Number.isFinite(configuredPauseSeconds) && configuredPauseSeconds >= 0
    ? configuredPauseSeconds
    : 2) * 1000;
  let state = "idle";
  let runId = 0;
  let suggestedPath = [];
  /** Slide index that already auto-paused; resume continues without pausing again. */
  let skipAutoPauseIndex = undefined;
  /** After a path is generated, the next Play joins at suggestedPath[0]. */
  let joinSuggestedPathOnPlay = false;

  const suggestedNext = (index) => {
    if (!suggestedPath.length) return undefined;
    const position = suggestedPath.indexOf(index);
    if (position >= 0) return suggestedPath[position + 1];
    return suggestedPath.find((candidate) => candidate > index) ?? suggestedPath[0];
  };

  const slideHasAiIndex = (index) => {
    const slide = root.querySelector(`.segment[data-index="${index}"]`);
    return slide instanceof HTMLElement && slide.hasAttribute("data-xframe-has-ai-index");
  };

  const slideHasWalkthroughPause = (index) => {
    const slide = root.querySelector(`.segment[data-index="${index}"]`);
    return slide instanceof HTMLElement && slide.dataset.xframeWalkthroughPause === "true";
  };

  const slideShouldAutoPause = (index) => slideHasAiIndex(index) || slideHasWalkthroughPause(index);

  const setState = (next) => {
    state = next;
    root.dataset.walkthroughState = next;
    const active = next === "playing";
    button.textContent = active ? "⏸" : (next === "complete" ? "↻" : "▶");
    button.setAttribute("aria-pressed", String(active));
    button.setAttribute("aria-label", active
      ? "Pause presentation walkthrough"
      : next === "complete"
        ? "Replay presentation walkthrough"
        : "Start presentation walkthrough");
    button.title = active ? "Pause walkthrough (w)" : "Start walkthrough (w)";
  };

  const delay = (milliseconds, id) => new Promise((resolve) => {
    const started = performance.now();
    const check = (now) => {
      if (id !== runId || state !== "playing") resolve(false);
      else if (now - started >= milliseconds) resolve(true);
      else requestAnimationFrame(check);
    };
    requestAnimationFrame(check);
  });

  const run = async (id) => {
    while (id === runId && state === "playing") {
      const index = runtime.hud.index;
      const narrative = runtime.narrative;
      if (narrative && typeof narrative.play === "function") {
        await narrative.play(index);
      }
      if (id !== runId || state !== "playing") return;
      // Pause after narration so the audience can choose / use AI before continuing.
      if (slideShouldAutoPause(index) && skipAutoPauseIndex !== index) {
        skipAutoPauseIndex = index;
        pause();
        return;
      }
      if (!await delay(TRANSITION_PAUSE_MS, id)) return;
      if (id !== runId || state !== "playing") return;
      const next = suggestedNext(index);
      const advanced = suggestedPath.length
        ? Number.isInteger(next) && (runtime.hud.goTo(next, "walkthrough"), true)
        : runtime.hud.next("walkthrough");
      if (!advanced) {
        setState("complete");
        return;
      }
    }
  };

  const start = (fromBeginning = false) => {
    runtime.narrative?.stop?.();
    runId += 1;
    const restart = fromBeginning || state === "complete";
    if (restart) {
      skipAutoPauseIndex = undefined;
      joinSuggestedPathOnPlay = false;
      runtime.hud.goTo(suggestedPath.length ? suggestedPath[0] : 0, "walkthrough");
    } else if (joinSuggestedPathOnPlay && suggestedPath.length) {
      joinSuggestedPathOnPlay = false;
      skipAutoPauseIndex = undefined;
      runtime.hud.goTo(suggestedPath[0], "walkthrough");
    }
    setState("playing");
    void run(runId);
  };

  const pause = () => {
    runId += 1;
    runtime.narrative?.stop?.();
    setState("paused");
  };

  const stop = () => {
    runId += 1;
    runtime.narrative?.stop?.();
    skipAutoPauseIndex = undefined;
    joinSuggestedPathOnPlay = false;
    setState("idle");
  };

  const toggle = (fromBeginning = false) => {
    if (state === "playing") pause();
    else start(fromBeginning);
  };

  button.addEventListener("click", (event) => toggle(event.shiftKey));
  window.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && state !== "idle") stop();
    else if (event.key.toLowerCase() === "w" && !event.ctrlKey && !event.metaKey && !event.altKey) {
      const target = event.target;
      if (target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement
        || target instanceof HTMLSelectElement || target?.isContentEditable) return;
      event.preventDefault();
      toggle(event.shiftKey);
    }
  });
  root.addEventListener("xframe:slidechange", (event) => {
    if (state !== "playing" || !(event instanceof CustomEvent)
      || event.detail?.source === "walkthrough") return;
    runId += 1;
    const id = runId;
    runtime.narrative?.stop?.();
    queueMicrotask(() => {
      if (id === runId && state === "playing") void run(id);
    });
  });
  root.addEventListener("xframe:aiindexchange", (event) => {
    if (!(event instanceof CustomEvent) || !Array.isArray(event.detail?.slides)) return;
    suggestedPath = [...new Set(event.detail.slides
      .map((slide) => Number(slide) - 1)
      .filter((index) => Number.isInteger(index) && index >= 0))];
    joinSuggestedPathOnPlay = suggestedPath.length > 0;
  });

  setState("idle");
  return { start, pause, stop, get state() { return state; } };
});
</script>

<script>
window.__XFRAME__.runtime.register("zoom", { import: ["crop.bakeRuler"] }, (runtime) => {
  const overlay = document.createElement("div");
  overlay.className = "xframe-zoom-overlay";
  overlay.hidden = true;
  overlay.innerHTML = '<div class="xframe-zoom-stage" role="dialog" aria-modal="true" aria-label="Enlarged view"></div>';
  const stage = overlay.querySelector(".xframe-zoom-stage");
  document.body.appendChild(overlay);
  /** @type {{ marker: Comment, frame: HTMLIFrameElement } | { marker: Comment, host: Element } | null} */
  let parked = null;
  const restoreParked = () => {
    if (!parked) return;
    if ("frame" in parked && parked.marker.parentNode) {
      parked.marker.parentNode.insertBefore(parked.frame, parked.marker);
      parked.marker.remove();
    } else if ("host" in parked && parked.marker.parentNode) {
      const expandBtn = parked.host.querySelector(".xframe-html-expand");
      if (expandBtn) expandBtn.hidden = false;
      parked.marker.parentNode.insertBefore(parked.host, parked.marker);
      parked.marker.remove();
    }
    parked = null;
  };

  const close = () => {
    restoreParked();
    overlay.hidden = true;
    stage.replaceChildren();
    stage.classList.remove("xframe-zoom-stage-html", "xframe-zoom-stage-ruler");
  };

  /** True when the detail crop has a draggable callout on the source image. */
  const detailIsDraggable = (detailId) => {
    if (!detailId) return false;
    return Boolean(document.querySelector(
      `.xframe-crop[data-xframe-crop-detail="${CSS.escape(detailId)}"][data-xframe-draggable="true"]`,
    ));
  };

  /** Enlarge an `@image` with `mm_ruler` (crop viewport + X/Y ticks when present). */
  const zoomMmRulerImage = (image) => {
    const ruler = image.closest(".xframe-mm-ruler");
    if (!ruler) return false;
    const clone = ruler.cloneNode(true);
    clone.classList.add("xframe-zoom-ruler");
    const detailId = image.id?.trim()
      || ruler.getAttribute("data-xframe-crop-detail")?.trim()
      || "";
    if (detailId) clone.setAttribute("data-xframe-crop-detail", detailId);
    if (detailIsDraggable(detailId)) {
      clone.setAttribute("data-xframe-draggable", "true");
      clone.setAttribute("role", "slider");
      clone.setAttribute("tabindex", "0");
      clone.setAttribute("aria-label", "Drag to reposition detail crop");
    }
    clone.querySelectorAll("[data-click-to-zoom]").forEach((el) => {
      el.removeAttribute("data-click-to-zoom");
    });
    clone.querySelectorAll("[id]").forEach((el) => {
      el.removeAttribute("id");
    });
    stage.classList.remove("xframe-zoom-stage-html");
    stage.classList.add("xframe-zoom-stage-ruler");
    runtime.crop?.bakeRuler?.(clone, image);
    stage.replaceChildren(clone);
    return true;
  };

  /** Enlarge a plain `@image` (no mm_ruler) to fill the zoom stage, including
   *  small-intrinsic SVGs that would otherwise stay tiny with width:auto. */
  const zoomPlainImage = (image) => {
    const clone = image.cloneNode(true);
    if (clone instanceof HTMLElement) clone.removeAttribute("data-click-to-zoom");
    const nw = image.naturalWidth || 0;
    const nh = image.naturalHeight || 0;
    if (nw > 0 && nh > 0) {
      const maxW = Math.min(window.innerWidth * 0.92, 1100);
      const maxH = window.innerHeight * 0.88;
      const fit = Math.min(maxW / nw, maxH / nh);
      if (clone instanceof HTMLElement) {
        clone.style.width = `${Math.max(1, Math.round(nw * fit))}px`;
        clone.style.height = `${Math.max(1, Math.round(nh * fit))}px`;
        clone.style.maxWidth = "none";
        clone.style.maxHeight = "none";
      }
    }
    stage.classList.remove("xframe-zoom-stage-html", "xframe-zoom-stage-ruler");
    stage.replaceChildren(clone);
    return true;
  };

  document.addEventListener("click", (event) => {
    if (!overlay.hidden) { if (event.target === overlay) close(); return; }
    const image = event.target instanceof Element
      ? event.target.closest("img[data-click-to-zoom='true']")
      : null;
    if (image) {
      event.preventDefault();
      if (!zoomMmRulerImage(image)) zoomPlainImage(image);
      overlay.hidden = false;
      return;
    }
    const qr = event.target instanceof Element
      ? event.target.closest(".xframe-qr-code[data-click-to-zoom='true']")
      : null;
    if (qr instanceof HTMLElement) {
      event.preventDefault();
      const clone = qr.cloneNode(true);
      if (clone instanceof HTMLElement) clone.removeAttribute("data-click-to-zoom");
      stage.classList.remove("xframe-zoom-stage-html", "xframe-zoom-stage-ruler");
      stage.replaceChildren(clone);
      overlay.hidden = false;
      return;
    }
    const callout = event.target instanceof Element
      ? event.target.closest(".xframe-crop-callout[data-click-to-zoom='true']")
      : null;
    if (callout instanceof HTMLElement) {
      const detailId = callout.getAttribute("data-xframe-crop-detail")?.trim();
      const detail = detailId ? document.getElementById(detailId) : null;
      if (detail instanceof HTMLImageElement) {
        event.preventDefault();
        event.stopPropagation();
        if (!zoomMmRulerImage(detail)) zoomPlainImage(detail);
        overlay.hidden = false;
      }
      return;
    }
    const expand = event.target instanceof Element
      ? event.target.closest(".xframe-html-host[data-click-to-zoom='true'] .xframe-html-expand")
      : null;
    if (!expand) return;
    event.preventDefault();
    const host = expand.closest(".xframe-html-host");
    if (!host) return;
    const frame = host.querySelector("iframe.xframe-html");
    stage.classList.add("xframe-zoom-stage-html");
    stage.classList.remove("xframe-zoom-stage-ruler");
    // Move the live node into the overlay so blob/srcdoc state is preserved
    // (cloning an embed iframe after its blob URL was revoked yields a blank frame).
    const marker = document.createComment("xframe-html-zoom");
    if (frame) {
      frame.parentNode.insertBefore(marker, frame);
      stage.replaceChildren(frame);
      parked = { marker, frame };
    } else {
      host.parentNode.insertBefore(marker, host);
      const expandBtn = host.querySelector(".xframe-html-expand");
      if (expandBtn) expandBtn.hidden = true;
      stage.replaceChildren(host);
      parked = { marker, host };
    }
    overlay.hidden = false;
  });
  window.addEventListener("keydown", (event) => { if (event.key === "Escape" && !overlay.hidden) close(); });
});
</script>
