# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Skip Pages on source/CI/data pushes; public/ (and other site files) still deploy.
  # Manual runs and workflow_run still deploy the full site.
  push:
    branches: ["main"]
    paths-ignore:
      - "examples/**"
      - "xframe/**"
      - "scripts/**"
      - ".github/**"
      - "HipStamp/**"
      - "eBay/**"
      - "browser_plugin/**"
      - "flyers/**"
      - "presentation/**"
      - "samples/**"
      - "uploads/**"
      - "public/listings/**"

  # Pushes from CI bots use GITHUB_TOKEN and do not fire `push` workflows; redeploy when they finish.
  workflow_run:
    workflows: ["xFrame consolidate", "Catalog Viewers"]
    types: [completed]
    branches: [main]

  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          fetch-depth: 1
          # HEAD is ~230MB (samples/uploads/examples). Pages only builds ./public (~21MB).
          sparse-checkout: public
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./public
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
