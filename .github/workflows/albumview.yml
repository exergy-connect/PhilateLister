# Compile Album View and publish to public/albumview/.
# Catalogues are not copied here — they live in public/catalogs/ (see setfinder workflow).
name: Album View

on:
  push:
    branches:
      - main
    paths:
      - "examples/AlbumView/**"
      - ".github/workflows/albumview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: albumview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Compile AlbumView
        uses: exergy-connect/xFrame.ai/actions/xform@main
        with:
          working-directory: examples/AlbumView
          sources: filters.js index.xp
          materialization: html

      - name: Publish to public/albumview
        run: |
          set -euo pipefail
          src_html="examples/AlbumView/output/index.html"
          if [[ ! -f "$src_html" ]]; then
            echo "::error file=${src_html}::AlbumView HTML was not produced"
            exit 1
          fi
          mkdir -p public/albumview
          cp "$src_html" public/albumview/index.html
          if [[ -f examples/AlbumView/favicon.ico ]]; then
            cp examples/AlbumView/favicon.ico public/albumview/favicon.ico
          fi
          built_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          sed -i "s/<html /<html data-built=\"${built_at}\" /" public/albumview/index.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/albumview
          if git diff --staged --quiet; then
            echo "No changes to public/albumview/."
            exit 0
          fi
          git commit -m "public: refresh albumview viewer (CI)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
